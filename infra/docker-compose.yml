name: 'Discly Infra'

services:
  database:
    image: postgres:17.10
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: discly-db
    ports:
      - 5432:5432

  mailcatcher:
    container_name: Mailcatcher
    image: sj26/mailcatcher
    ports:
      - 1080:1080
      - 1025:1025
