name: Linting

on: pull_request

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version-file: ".nvmrc"

      - run: npm ci

      - run: npm run lint:prettier:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version-file: ".nvmrc"

      - run: npm ci

      - run: npm run lint:eslint:check
